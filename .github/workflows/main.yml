name: Build Sonic RD

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/stephane-d/sgdk:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile ROM
        run: make -f /sgdk/makefile.gen

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonic-rd-rom
          path: out/rom.bin
