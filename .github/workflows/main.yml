name: Build Sonic RD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build SGDK ROM
        uses: theophile/sgdk-action@v1

      - name: Upload compiled ROM
        uses: actions/upload-artifact@v4
        with:
          name: sonic-rd-rom
          path: out/rom.bin
